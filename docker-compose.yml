services:
  mysql:
    image: mysql:8.0.36
    container_name: onlyoffice-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - onlyoffice-net

  documentserver:
    image: onlyoffice/documentserver:8.3.3
    container_name: onlyoffice-documentserver
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_HEADER: Authorization

      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PWD: ${MYSQL_PASSWORD}
    volumes:
      - ./data/documentserver/data:/var/www/onlyoffice/Data
      - ./data/documentserver/logs:/var/log/onlyoffice
      - ./data/documentserver/lib:/var/lib/onlyoffice
    networks:
      - onlyoffice-net

  nginx:
    image: nginx:1.24-alpine
    container_name: onlyoffice-nginx
    restart: unless-stopped
    depends_on:
      - documentserver
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - onlyoffice-net

networks:
  onlyoffice-net:
    driver: bridge
